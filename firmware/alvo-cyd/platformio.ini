; CYD (ESP32-2432S028R) — BLE advertising sniffer -> serial -> Wireshark (extcap)
; Flags de tela do CYD ESP32-2432S028R (ILI9341). Outra revisao de placa (ST7789,
; ou o toque em outros GPIOs) troca este bloco e nada mais — ver docs/INSTALL.md.
[env:cyd]
build_src_filter = +<main.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI@^2.5.43        ; BLE vem no core do ESP32, sem lib extra

build_flags =
    ; ---- display (CYD 2432S028R) ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D CORE_DEBUG_LEVEL=1

; Painel 3xN (ESP-NOW/BT/WiFi x N ancoras). Mesma placa e mesmos flags de tela;
; so troca o fonte e acha credenciais.h no projeto do C3 (gitignorado, nao duplicar).
[env:painel]
extends = env:cyd
build_src_filter = +<painel.cpp>
build_flags = ${env:cyd.build_flags} -I$PROJECT_DIR/../ancora-c3/main
; WiFi+BLE+TFT juntos passam de 1,31 MB do particionamento padrao. huge_app da
; 3 MB de app (sem OTA, que nao usamos) e vem no proprio core.
board_build.partitions = huge_app.csv
; A porta e da SUA maquina. Sem estas duas linhas o PlatformIO detecta sozinho, o
; que funciona quando so a CYD esta no USB. Com mais de uma placa ligada, fixe:
;   export RTLS_PORTA_CYD=/dev/cu.usbserial-XXXX   (macOS)  ou /dev/ttyUSB0 (Linux)
upload_port = ${sysenv.RTLS_PORTA_CYD}
monitor_port = ${sysenv.RTLS_PORTA_CYD}

; Campanha de rotulos: planta na tela + toque, rotulo por UDP na hora.
; Mesmo fonte de referencia do painel; sem promiscuo (fase de 2 s deixava o
; toque surdo). Precisa do touch, que env:cyd nao usa.
[env:campanha]
extends = env:painel
build_src_filter = +<campanha.cpp>
lib_deps =
    ${env:cyd.lib_deps}
    ; registry nao tem paulstoffregen/XPT2046_Touchscreen@^1.4 — vai no GitHub
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
